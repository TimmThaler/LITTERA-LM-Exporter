name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.variant }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Windows Onefile
          - os: windows-latest
            variant: onefile
            artifact: LMF-Manager-Windows-Onefile
            output: dist/LMF-Export-Manager.exe

          # Windows Folder (multi-file)
          - os: windows-latest
            variant: folder
            artifact: LMF-Manager-Windows-Folder
            zip: LMF-Export-Manager-Windows-Folder.zip

          # Linux
          - os: ubuntu-latest
            variant: default
            artifact: LMF-Manager-Linux
            output: dist/LMF-Export-Manager

          # macOS
          - os: macos-latest
            variant: default
            artifact: LMF-Manager-Mac
            zip: LMF-Export-Manager-Mac.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ------------------------
      # Windows Onefile
      # ------------------------
      - name: Build Windows Onefile
        if: matrix.os == 'windows-latest' && matrix.variant == 'onefile'
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --collect-all customtkinter ^
            --icon="icon.ico" ^
            --name "LMF-Export-Manager" ^
            generate_mit_gui.py

      # ------------------------
      # Windows Folder
      # ------------------------
      - name: Build Windows Folder
        if: matrix.os == 'windows-latest' && matrix.variant == 'folder'
        run: |
          pyinstaller --noconfirm --windowed ^
            --collect-all customtkinter ^
            --icon="icon.ico" ^
            --name "LMF-Export-Manager" ^
            generate_mit_gui.py

      - name: Zip Windows Folder
        if: matrix.os == 'windows-latest' && matrix.variant == 'folder'
        run: |
          Compress-Archive -Path dist/LMF-Export-Manager/* `
            -DestinationPath ${{ matrix.zip }}

      # ------------------------
      # macOS / Linux
      # ------------------------
      - name: Build macOS / Linux
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconfirm \
            --windowed \
            --collect-all customtkinter \
            --icon="icon.ico" \
            --name "LMF-Export-Manager" \
            generate_mit_gui.py

      - name: Zip macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "../${{ matrix.zip }}" LMF-Export-Manager.app

      # ------------------------
      # Upload Artifacts
      # ------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.zip }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
