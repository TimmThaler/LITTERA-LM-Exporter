name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: LMF-Manager-Windows
            output_path: dist/LMF-Manager.exe

          - os: ubuntu-latest
            artifact_name: LMF-Manager-Linux
            output_path: dist/LMF-Manager

          - os: macos-latest
            artifact_name: LMF-Manager-Mac-latest
            zip_name: LMF-Manager-Mac-latest.zip

          - os: macos-11
            artifact_name: LMF-Manager-Mac-macos11
            zip_name: LMF-Manager-Mac-macos11.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm \
            --windowed \
            --onefile \
            --collect-all customtkinter \
            --name "LMF-Manager" \
            generate_mit_gui.py

      # macOS App zippen
      - name: Zip macOS App
        if: startsWith(matrix.os, 'macos')
        run: |
          cd dist
          zip -r "../${{ matrix.zip_name }}" LMF-Manager.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.output_path }}
            ${{ matrix.zip_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
