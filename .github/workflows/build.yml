name: Build Executables

on:
  push:
    tags: [ "v*" ] 
  workflow_dispatch: 

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: LMF-Export-Manager_windows
            extension: .exe
          - os: ubuntu-latest
            artifact_name: LMF-Export-Manager_linux
            extension: ""
          - os: macos-latest
            artifact_name: LMF-Export-Manager_macos
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
        shell: bash

      - name: Zip Immediately and Cleanup
        shell: bash
        run: |
          # 1. In den dist-Ordner gehen
          cd dist
          
          # 2. Direkt hier drin zippen
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            # Mac: Zippe den .app Ordner (-r für rekursiv)
            zip -r "../${{ matrix.artifact_name }}.zip" "LMF-Export-Manager.app"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows: Nutze PowerShell zum Zippen der einen .exe
            powershell Compress-Archive -Path "LMF-Export-Manager.exe" -DestinationPath "../${{ matrix.artifact_name }}.zip"
          else
            # Linux: Zippe die eine Datei
            zip "../${{ matrix.artifact_name }}.zip" "LMF-Export-Manager"
          fi
          
          # 3. Zurück ins Hauptverzeichnis
          cd ..
          
          # 4. RADIKAL-REINIGUNG: Lösche ALLES außer der neuen ZIP-Datei
          # Das stellt sicher, dass der Runner nur noch EINE Datei sieht.
          rm -rf dist
          rm -rf build
          rm -f *.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # Wir laden nur die EINE Zip-Datei hoch, die im Hauptverzeichnis liegt
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete old release assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          assets: '*.*'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Anhängen der 3 Zip-Dateien
          files: ./release_assets/*.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
