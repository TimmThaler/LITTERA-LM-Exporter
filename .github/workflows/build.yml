name: Build Executables

on:
  push:
    tags: [ "v*" ] # Trigger bei Tags wie v1.0.1
  workflow_dispatch: # Erlaubt manuelles Starten

jobs:
  build:
    strategy:
      matrix:
        # Die drei Betriebssysteme, für die kompiliert werden soll
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: LMF-Export-Manager_windows
            extension: .exe
          - os: ubuntu-latest
            artifact_name: LMF-Export-Manager_linux
            extension: ""
          - os: macos-latest
            artifact_name: LMF-Export-Manager_macos
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Hier deine gewünschte Version eintragen

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
        shell: bash

      - name: Prepare Artifact (Zip)
        run: |
          cd dist
          # Umbenennen für Klarheit (optional)
          mv LMF-Export-Manager${{ matrix.extension }} ${{ matrix.artifact_name }}${{ matrix.extension }}
          # Zippen (Windows nutzt PowerShell, Unix nutzt zip)
          if [ "${{ runner.os }}" == "Windows" ]; then
            powershell Compress-Archive -Path "${{ matrix.artifact_name }}${{ matrix.extension }}" -DestinationPath "../${{ matrix.artifact_name }}.zip"
          else
            zip "../${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name }}${{ matrix.extension }}"
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') # Nur ausführen, wenn ein Tag gepusht wurde
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, um Dateien an das Release anzuhängen

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
