name: Build Executables

on:
  push:
    tags: [ "v*" ] 
  workflow_dispatch: 

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: LMF-Export-Manager_windows
            extension: .exe
          - os: ubuntu-latest
            artifact_name: LMF-Export-Manager_linux
            extension: ""
          - os: macos-latest
            artifact_name: LMF-Export-Manager_macos
            extension: "" # Mac nutzt .app Ordner, der gezippt wird

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: |
          # Wir bauen die App
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
        shell: bash

      - name: Packaging (Strict Isolation)
        shell: bash
        run: |
          # 1. Erstelle einen leeren Staging-Ordner
          mkdir staging
          
          # 2. Logik für macOS (.app ist ein Verzeichnis) vs Windows/Linux (Datei)
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            # Auf Mac existiert meist beides: das binary und das .app Bundle. 
            # Wir nehmen das Bundle, falls vorhanden, sonst das binary.
            if [ -d "dist/LMF-Export-Manager.app" ]; then
              cp -r "dist/LMF-Export-Manager.app" "staging/LMF-Export-Manager.app"
            else
              cp "dist/LMF-Export-Manager" "staging/${{ matrix.artifact_name }}"
            fi
          else
            # Windows und Linux: Einfach die einzelne Datei kopieren
            cp dist/LMF-Export-Manager${{ matrix.extension }} staging/${{ matrix.artifact_name }}${{ matrix.extension }}
          fi

          # 3. Zippe den Inhalt des staging-Ordners in eine einzige Datei
          cd staging
          if [ "${{ runner.os }}" == "Windows" ]; then
            powershell Compress-Archive -Path "*" -DestinationPath "../${{ matrix.artifact_name }}.zip"
          else
            zip -r "../${{ matrix.artifact_name }}.zip" .
          fi
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # WICHTIG: Nur die eine ZIP-Datei hochladen!
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Delete old release assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          assets: '*.*'
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_files/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Es werden nur die 3 ZIP-Dateien angehängt
          files: ./release_files/*.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
