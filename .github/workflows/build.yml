name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LMF-Manager-Windows
            binary_path: dist/LMF-Export-Manager.exe
            final_name: LMF-Export-Manager-Windows.exe

          - os: ubuntu-latest
            artifact_name: LMF-Manager-Linux
            binary_path: dist/LMF-Export-Manager
            final_name: LMF-Export-Manager-Linux

          - os: macos-latest
            artifact_name: LMF-Manager-Mac
            binary_path: dist/LMF-Export-Manager.app
            final_name: LMF-Manager-Mac.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller customtkinter

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Wir erzwingen --onefile für Windows und Linux
          # Für Mac lassen wir es weg, da .app ein Ordner ist
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            pyinstaller --noconfirm --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
          else
            pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
          fi

      - name: Prepare Artifact for Upload
        shell: bash
        run: |
          mkdir -p upload_dir
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            cd dist && zip -r "../upload_dir/${{ matrix.final_name }}" "LMF-Export-Manager.app" && cd ..
          else
            # Wir verschieben NUR die eine Datei in das upload_dir
            cp ${{ matrix.binary_path }} upload_dir/${{ matrix.final_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: upload_dir/  # Lädt NUR den Inhalt von upload_dir hoch (eine Datei)
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          # In v4 werden Artefakte in Unterordnern gespeichert (all_artifacts/LMF-Manager-Windows/...)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all_artifacts/LMF-Manager-Windows/LMF-Export-Manager-Windows.exe
            all_artifacts/LMF-Manager-Linux/LMF-Export-Manager-Linux
            all_artifacts/LMF-Manager-Mac/LMF-Manager-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
