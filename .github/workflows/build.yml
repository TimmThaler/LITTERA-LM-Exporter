name: Build Executables

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: LMF-Export-Manager_windows
            extension: .exe
          - os: ubuntu-latest
            artifact_name: LMF-Export-Manager_linux
            extension: ""
          - os: macos-latest
            artifact_name: LMF-Export-Manager_macos
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
        shell: bash

      - name: Clean and Zip
        shell: bash
        run: |
          # 1. Erstelle einen völlig isolierten Ordner außerhalb von dist/build
          mkdir FINAL_OUT
          
          # 2. Kopiere NUR das Ergebnis hinein
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            # Auf Mac nehmen wir das .app Bundle (was ein Ordner ist)
            cp -r "dist/LMF-Export-Manager.app" "FINAL_OUT/"
          else
            # Windows/Linux: Die eine Datei kopieren und umbenennen
            cp "dist/LMF-Export-Manager${{ matrix.extension }}" "FINAL_OUT/${{ matrix.artifact_name }}${{ matrix.extension }}"
          fi
          
          # 3. WICHTIG: Lösche den gesamten dist und build Ordner! 
          # Damit existieren die 300+ Einzeldateien nicht mehr auf dem Runner.
          rm -rf dist
          rm -rf build
          
          # 4. Zippe den isolierten Ordner
          cd FINAL_OUT
          if [ "${{ runner.os }}" == "Windows" ]; then
            powershell Compress-Archive -Path "*" -DestinationPath "../${{ matrix.artifact_name }}.zip"
          else
            zip -r "../${{ matrix.artifact_name }}.zip" .
          fi
          cd ..
          
          # 5. Lösche auch den FINAL_OUT Ordner
          rm -rf FINAL_OUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # Wir geben hier EXAKT den Pfad zur ZIP-Datei an. 
          # Da alles andere gelöscht wurde, kann GitHub nichts anderes finden.
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete old release assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          assets: '*.*'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all_zipped_files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Hier sagen wir explizit: Nimm nur die .zip Dateien
          files: ./all_zipped_files/*.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
