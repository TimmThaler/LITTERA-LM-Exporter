name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: LMF-Manager-Windows
            build_cmd: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
            upload_path: dist/LMF-Export-Manager.exe

          - os: ubuntu-latest
            artifact_name: LMF-Manager-Linux
            # Hier ist das --onefile wichtig!
            build_cmd: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
            upload_path: dist/LMF-Export-Manager

          - os: macos-latest
            artifact_name: LMF-Manager-Mac
            # macOS .app ist ein Ordner, daher hier kein --onefile, wir zippen es später
            build_cmd: pyinstaller --noconfirm --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
            upload_path: LMF-Manager-Mac.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Beschleunigt zukünftige Builds

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Zip macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r "../LMF-Manager-Mac.zip" "LMF-Export-Manager.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig für neuere GITHUB_TOKEN Berechtigungen

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Nutzt Wildcards, um alle Dateien in den Unterordnern zu finden
          files: |
            artifacts/LMF-Manager-Windows/LMF-Export-Manager.exe
            artifacts/LMF-Manager-Linux/LMF-Export-Manager
            artifacts/LMF-Manager-Mac/LMF-Manager-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
