name: Build Executables

on:
  push:
    tags: [ "v*" ] # Trigger bei Tags wie v1.0.1
  workflow_dispatch: # Erlaubt manuelles Starten

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: LMF-Export-Manager_windows
            extension: .exe
          - os: ubuntu-latest
            artifact_name: LMF-Export-Manager_linux
            extension: ""
          - os: macos-latest
            artifact_name: LMF-Export-Manager_macos
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter # customtkinter explizit installieren
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: |
          # Wir bauen das Programm. Die Ausgabe landet standardmäßig in 'dist/LMF-Export-Manager'
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --name "LMF-Export-Manager" generate_mit_gui.py
        shell: bash

      - name: Isolate and Zip Binary
        # Dieser Schritt verhindert, dass hunderte temporäre Dateien mitgezippt werden
        run: |
          # 1. Erstelle einen komplett sauberen Ordner für den Export
          mkdir export_folder
          
          # 2. Kopiere NUR die fertige Datei aus 'dist' in den sauberen Ordner
          # Dabei wird sie direkt in den gewünschten Artefakt-Namen umbenannt
          cp dist/LMF-Export-Manager${{ matrix.extension }} export_folder/${{ matrix.artifact_name }}${{ matrix.extension }}
          
          # 3. In den Ordner wechseln und zippen (stellt sicher, dass keine Pfad-Strukturen im Zip sind)
          cd export_folder
          if [ "${{ runner.os }}" == "Windows" ]; then
            powershell Compress-Archive -Path "*" -DestinationPath "../${{ matrix.artifact_name }}.zip"
          else
            zip ../${{ matrix.artifact_name }}.zip *
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # Hier wird nur die EINE Zip-Datei hochgeladen, die wir gerade erstellt haben
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_files/
          merge-multiple: true # Legt alle Zips flach in den Ordner

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Hier werden nur die .zip Dateien aus dem Ordner angehängt
          files: ./release_files/*.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
